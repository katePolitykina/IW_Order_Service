databaseChangeLog:
  - changeSet:
      id: add-status-to-order-table
      author: katapalk
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_orders_user_id
            tableName: orders
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_orders_status
            tableName: orders
            columns:
              - column:
                  name: status